<title>Contact - ข้อมูลการติดต่อ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Sarabun', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #95c8d8 0%, #89CFEF 50%, #C3EEFA 100%);
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .container {
        background: #ffffff;

        border-radius: 28px;

        padding: 40px 25px;

        width: 100%;
        max-width: 550px;

        box-shadow: 0 15px 35px rgba(0, 120, 180, 0.2);

        border: 2px solid #89CFEF;

        text-align: center;
    }

    .page-title {
        font-size: 2rem;
        font-weight: 700;

        color: #73c2fb;

        margin-bottom: 8px;
    }

    .subtitle {
        color: #89CFEF;

        margin-bottom: 30px;
    }

    .contact-box {
        background: linear-gradient(135deg, #e9f9ff, #f7fdff);

        border: 1px solid #C3EEFA;

        border-radius: 18px;

        padding: 25px 20px;

        margin-bottom: 30px;
    }

    .contact-label {
        display: block;

        color: #5eb7e8;

        font-weight: 700;

        font-size: 1.1rem;

        margin-bottom: 8px;
    }

    .contact-email {
        color: #4baee2;

        font-size: 1rem;

        font-weight: 600;

        text-decoration: none;

        word-break: break-word;
    }

    .contact-email:hover {
        text-decoration: underline;
    }

    .btn-group {
        display: flex;

        justify-content: center;

        gap: 10px;
    }

    .btn {
        display: inline-block;

        text-decoration: none;

        padding: 10px 24px;

        border-radius: 25px;

        font-size: 0.9rem;

        font-weight: 600;

        transition: 0.3s;
    }

    .btn-secondary {
        background: #ffffff;

        color: #73bde8;

        border: 2px solid #95c8d8;
    }

    .btn-primary {
        background: linear-gradient(135deg, #73c2fb, #89CFEF);

        color: white;

        box-shadow: 0 4px 12px rgba(115, 194, 251, 0.3);
    }

    .btn:hover {
        transform: translateY(-2px);
    }

    @media (max-width: 500px) {
        .btn-group {
            flex-direction: column;
        }
    }
</style>
```

</head>

<body>

    </div>

</div>
